[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 120

[lint]
exclude_lints = ["unsafe-typecast"]
